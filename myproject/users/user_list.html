<div>
    {% for user in users %}
        <p>{{ user.username }}</p>
    {% endfor %}
</div>

<div class="pagination">
    {% if users.has_previous %}
        <a href="?page=1">Первая</a>
        <a href="?page={{ users.previous_page_number }}">Назад</a>
    {% endif %}

    <span>Страница {{ users.number }} из {{ users.paginator.num_pages }}</span>

    {% if users.has_next %}
        <a href="?page={{ users.next_page_number }}">Вперед</a>
        <a href="?page={{ users.paginator.num_pages }}">Последняя</a>
    {% endif %}
</div>
<p>Дата регистрации: {{ user.date_joined|date:"d M Y" }}</p>
